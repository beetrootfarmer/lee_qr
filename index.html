<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안내</title>
  <style>
    body { margin: 0; background-color: #fbefe0; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; }
    img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  </style>
</head>
<body>
  <img id="introImage" src="image.png" alt="안내 이미지">

  <script>
    var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdy9w-aN8FgwZO-ulbGoV-FP9E6t23JjLFBIUkcvKKVpxohaw/viewform";
    var SHOW_MS = 5000;
    var moved = false;
    var started = false;

    function goToForm() {
      if (moved) return;
      moved = true;
      window.location.replace(FORM_URL);
    }

    // 이미지가 화면에 뜬 시점부터 5초 보여준 뒤 구글폼으로 이동
    function startTimer() {
      if (started) return;
      started = true;
      setTimeout(goToForm, SHOW_MS);
    }

    var img = document.getElementById('introImage');
    if (img.complete) startTimer();
    img.addEventListener('load', startTimer);
    img.addEventListener('error', goToForm);

    // 인터넷이 느려 이미지가 늦게 떠도 15초 뒤에는 이동 (안전장치)
    setTimeout(goToForm, 15000);
  </script>
</body>
</html>
